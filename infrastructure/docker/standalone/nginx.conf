# nginx for the single-container image (Dockerfile.standalone): plain HTTP on :8080, runs as a non-root user.
# Security headers and CSP come from the same snippets as production (infrastructure/nginx/snippets).
worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    server_tokens off;

    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    server {
        listen 8080;

        client_max_body_size 1m;

        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_min_length 256;
        gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp.conf;

        root /usr/share/nginx/html;
        index index.html;

        location /api/ {
            include /etc/nginx/snippets/proxy-backend.conf;
        }

        # Files for tasks and announcements (the backend checks MAX_UPLOAD_MB, 10 MB by default)
        location ~ ^/api/v1/(tasks|associations/posts)/[0-9]+/files$ {
            client_max_body_size 11m;
            include /etc/nginx/snippets/proxy-backend.conf;
        }

        # sw.js only removes the old offline worker from browsers; it and the manifest are re-read after every deploy
        location = /sw.js {
            try_files $uri =404;
            include /etc/nginx/snippets/security-headers.conf;
            include /etc/nginx/snippets/csp.conf;
            add_header Cache-Control "no-cache";
        }

        location = /manifest.webmanifest {
            try_files $uri =404;
            types { application/manifest+json webmanifest; }
            include /etc/nginx/snippets/security-headers.conf;
            include /etc/nginx/snippets/csp.conf;
            add_header Cache-Control "no-cache";
        }

        location ^~ /assets/ {
            try_files $uri =404;
            include /etc/nginx/snippets/security-headers.conf;
            include /etc/nginx/snippets/csp.conf;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
