# Per-IP limits are only coarse flood protection: the whole campus Wi-Fi reaches us from one NAT
# address. Per-account brute-force protection for logins is enforced in the backend.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=60r/m;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
limit_req_status 429;
limit_conn_status 429;

server_tokens off;

# Plain HTTP only serves ACME challenges and redirects everything else to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name ivitsh-portal.kosgos.ru ivitshguide.kosgos.ru portal.kosgos.ru ivitsh.kosgos.ru localhost;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ivitsh-portal.kosgos.ru ivitshguide.kosgos.ru portal.kosgos.ru ivitsh.kosgos.ru localhost;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Plain http:// sent to this port (e.g. typing localhost:443) gets a redirect instead of nginx's 400 page.
    error_page 497 =301 https://$host$request_uri;

    # The API takes small JSON bodies; only the file upload endpoints below accept more.
    client_max_body_size 1m;

    # Slowloris protection
    client_header_timeout 10s;
    client_body_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 10s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/csp.conf;

    root /usr/share/nginx/html;
    index index.html;

    location = /api/v1/auth/eios-login {
        limit_req zone=login_limit burst=60 nodelay;
        include /etc/nginx/snippets/proxy-backend.conf;
    }

    location = /api/v1/auth/admin-login {
        limit_req zone=login_limit burst=10 nodelay;
        include /etc/nginx/snippets/proxy-backend.conf;
    }

    location /api/ {
        limit_req zone=api_limit burst=100 nodelay;
        limit_conn conn_limit 50;
        include /etc/nginx/snippets/proxy-backend.conf;
    }

    # Files for tasks and announcements (the backend checks MAX_UPLOAD_MB, 10 MB by default)
    location ~ ^/api/v1/(tasks|associations/posts|events|achievements)/[0-9]+/files$ {
        client_max_body_size 11m;
        client_body_timeout 60s;
        limit_req zone=api_limit burst=20 nodelay;
        include /etc/nginx/snippets/proxy-backend.conf;
    }

    # Swagger UI (only answers when DOCS_ENABLED=true) needs its CDN script and an inline bootstrap script.
    location ~ ^/(docs|redoc|openapi\.json)$ {
        include /etc/nginx/snippets/proxy-backend.conf;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com; frame-ancestors 'self'" always;
    }

    # sw.js only removes the old offline worker from browsers; it and the manifest are re-read after every deploy
    location = /sw.js {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp.conf;
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        try_files $uri =404;
        types { application/manifest+json webmanifest; }
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp.conf;
        add_header Cache-Control "no-cache";
    }

    # Hashed Vite bundles never change once built.
    location ^~ /assets/ {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|mp3|pdf|woff2?)$ {
        try_files $uri =404;
        expires 30d;
    }

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
