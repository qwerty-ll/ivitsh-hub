# Run from the repository root:  docker compose -f infrastructure/docker-compose.yml up -d --build
# Requires ../.env (see .env.example) and TLS certificates in infrastructure/certs/ (see DEPLOYMENT_GUIDE.md).
services:
  db:
    image: postgres:16-alpine
    container_name: ivitsh_portal_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portal_db}
      POSTGRES_USER: ${POSTGRES_USER:-portal_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - portal_network

  # Shared state of the backend workers: rate limits, the tribes snapshot, GigaChat streams.
  # Nothing here needs to survive a restart, so no persistence.
  redis:
    image: redis:7-alpine
    container_name: ivitsh_portal_redis
    restart: always
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - portal_network

  backend:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile.server
    container_name: ivitsh_portal_backend
    restart: always
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-portal_user}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-portal_db}
      # Attached files (orders, scripts, mock-ups): personal data, back this volume up with the database
      UPLOAD_DIR: /app/data/uploads
      # Worker processes; more than one needs Redis (shared limits and caches) and PostgreSQL
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - backend_data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - portal_network

  # Nightly pg_dump and an archive of the uploaded files into infrastructure/backups (see DEPLOYMENT_GUIDE.md)
  backup:
    image: postgres:16-alpine
    container_name: ivitsh_portal_backup
    restart: always
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-portal_db}
      PGUSER: ${POSTGRES_USER:-portal_user}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      BACKUP_HOUR: ${BACKUP_HOUR:-00}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - backend_data:/app/data:ro
      - ./backups:/backups
      - ./docker/backup.sh:/usr/local/bin/portal-backup.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/portal-backup.sh"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - portal_network

  client:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile.client
    container_name: ivitsh_portal_client
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - ./certbot-www:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - portal_network

volumes:
  postgres_data:
  backend_data:

networks:
  portal_network:
    driver: bridge
